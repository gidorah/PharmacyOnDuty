# Work order (decision 7 of the software-factory design).
#
# This form applies no labels on purpose. Only a label Onur adds may start a
# factory job, and anyone can open an issue on this public repository.
# tests/test_factory_files.py fails if an agent:* label is added here.
#
# GitHub renders each answer under a "### <label>" heading, and the factory
# jobs read the issue body by those headings. Rename a field's label only
# together with the jobs that read it.
name: Work order
description: A task for the factory, with the fields Onur approves before work starts.
title: "[work order] "
body:
  - type: markdown
    attributes:
      value: |
        Fill in every field. Keep the change small enough for one agent session; split it if the size field gets long.
        A rough idea can go in a blank issue instead. The intake run turns those into work orders.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences on what changes and why.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What the agent must not touch or add. The reviewer flags work outside the goal, and the worker removes it.
      placeholder: |
        - No changes to pharmacies/views.py
        - No new dependencies
    validations:
      required: true

  - type: textarea
    id: test_points
    attributes:
      label: Test points
      description: Where the agent writes tests. It writes tests only here.
      placeholder: |
        - pharmacies/tests/test_istanbul_scraper.py: one district fails, the others still load
    validations:
      required: true

  - type: textarea
    id: done_check
    attributes:
      label: Done check
      description: The exact commands that must pass, plus any verification-skill flows.
      value: |
        - uv run ruff check .
        - uv run ruff format --check .
        - uv run mypy .
        - uv run pytest
    validations:
      required: true

  - type: textarea
    id: size
    attributes:
      label: Size
      description: The files the change will likely touch. If this won't fit one agent session, split the work order.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Does the change touch a path or category in factory/risk-map.yml? If it does, the change is tier C and Onur reads the diff.
      options:
        - "No high-risk area"
        - "Touches a high-risk area"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: risk_notes
    attributes:
      label: Risk notes
      description: Which high-risk areas, if any, and why. The tier job decides the final tier from the diff; this is only the proposal.
    validations:
      required: false

  - type: dropdown
    id: proposed_tier
    attributes:
      label: Proposed tier
      description: Check 5 of the tier rule. Used for planning only; it can never lower the tier the other checks give.
      options:
        - "B (Onur reads a summary)"
        - "C (Onur reads the diff)"
        - "A (only if a standing rule in factory/standing-rules.yml matches)"
    validations:
      required: true

  - type: textarea
    id: decision_log
    attributes:
      label: Decision log
      description: One entry per decision or assumption. Tag each one measured, inferred or guessed.
      value: |
        - [measured] what was checked, and how
        - [inferred] what follows from a measured fact
        - [guessed] what nobody has checked yet
    validations:
      required: false
