# Factory gate: the deterministic checks that decide whether a change is done.
#
# Layer 1 runs the static checks from .pre-commit-config.yaml with the same
# commands and versions: djlint through pre-commit itself, mypy and the
# migrations check with the hook's own commands. ruff runs from uv.lock (see
# the ruff steps). Layer 2 runs pytest against real PostGIS and Redis containers, with
# Celery tasks run inline and outbound network blocked. Layer 3, the scraper
# tests, runs inside layer 2. The test-removal job fails a change that deletes
# or skips tests. The final `gate` job is the single result to read.
#
# The label pipeline starts this workflow with `gh workflow run`, because pull
# requests opened with the built-in token get runs that wait for approval:
#
#   gh workflow run factory-gate.yml --ref <branch> -f base=main
#
# Removing a test on purpose: Onur adds the `allow-test-removal` label after
# the last commit. Only the run that adding the label starts accepts removals,
# and only for the head commit in that event. Every other run ignores the
# label: new commits, other label changes, and `workflow_dispatch` runs. See
# .github/scripts/override_label.py. factory-label-reset.yml removes the label
# when new commits arrive.

name: factory-gate

on:
  pull_request:
    # The default types, plus label changes for the allow-test-removal label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Branch to compare with for the test-removal check
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: factory-gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Placeholders, not secrets. Settings need a key to load, and the gate must
  # never hold a real Google Maps key.
  DJANGO_SECRET_KEY: factory-gate-placeholder-not-a-secret
  GOOGLE_MAPS_API_KEY: factory-gate-placeholder-not-a-key
  DJANGO_DEBUG: "False"
  UV_LOCKED: "1"

jobs:
  static:
    name: Layer 1 - static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # makemigrations only warns when it cannot reach a database; localhost
      # fails fast instead of waiting on a DNS lookup for "db".
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        id: deps
        run: uv sync

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Each check runs as its own step. A failing check does not stop the
      # later ones, so one run reports every failing check. A failed setup
      # step skips the checks that depend on it.
      #
      # ruff runs from uv.lock (0.16.1), the version CLAUDE.md tells agents to
      # use. The ruff hook in .pre-commit-config.yaml pins 0.8.2, which wants
      # to reformat files that 0.16.1 accepts, so the gate cannot match both.
      - name: ruff check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run ruff format --check --diff .

      - name: djlint format
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pre-commit run djlint-reformat-django --all-files --show-diff-on-failure

      - name: djlint lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pre-commit run djlint-django --all-files

      # mypy (through the django-stubs plugin) and makemigrations load
      # GeoDjango, which needs GDAL. The checks above run without it.
      - name: Install GDAL for GeoDjango
        id: gdal
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: .github/scripts/install_gdal.sh

      # The same command and file list as the mypy hook in
      # .pre-commit-config.yaml, in one process. `pre-commit run mypy
      # --all-files` splits the files across parallel mypy processes that
      # share .mypy_cache, and one of them crashed with an INTERNAL ERROR.
      - name: mypy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.gdal.outcome == 'success' }}
        run: |
          git ls-files -z '*.py' \
            | grep -zvE 'docs/|node_modules/|migrations/|.git/|.tox/|dist/|build/' \
            | xargs -0 uv run mypy

      - name: Missing migrations
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.gdal.outcome == 'success' }}
        run: uv run python manage.py makemigrations --check --dry-run

  tests:
    name: Layers 2 and 3 - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: gis
      DB_USER: postgres
      DB_PASSWORD: password
      CELERY_BROKER_URL: redis://localhost:6379/0
      # Settings stay production-like (DEBUG off, hashed static files), except
      # for the HTTPS redirect: the test client speaks plain HTTP, and in
      # production the TLS proxy does the redirect.
      DJANGO_SECURE_SSL_REDIRECT: "False"
      # Loads .github/scripts/factory_gate_pytest.py with `-p` below.
      PYTHONPATH: .github/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GDAL for GeoDjango
        timeout-minutes: 10
        run: .github/scripts/install_gdal.sh

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check PostGIS and Redis are reachable
        run: uv run python -m scripts.wait_for_services

      # With DEBUG off, templates need the static-files manifest, as in
      # production, where the deploy runs collectstatic.
      - name: collectstatic
        run: uv run python manage.py collectstatic --noinput

      # factory_gate_pytest blocks outbound network, runs Celery tasks inline,
      # and marks the tests in .github/factory-gate-known-failures.txt as
      # strict xfail. See the plugin's docstring.
      - name: pytest
        run: >-
          uv run pytest -p factory_gate_pytest -ra
          --junitxml=pytest-results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

  test-removal:
    name: Test-removal check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the pull request's label events for the approval check.
      issues: read
      pull-requests: read
    steps:
      # On pull_request events, check the head commit from the event payload.
      # For a `labeled` run that is the commit Onur saw when he added the
      # label, even if the branch moved since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Unit tests for the gate scripts
        run: python3 -I -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Pick the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="origin/${DISPATCH_BASE:-main}" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit for this event; nothing to compare."
            exit 0
          fi
          git rev-parse --verify --quiet "$base^{commit}" > /dev/null || {
            echo "::error::Base '$base' is not a commit in this repository."
            exit 1
          }
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Check for Onur's approval label
        id: approval
        if: ${{ steps.base.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          events="$RUNNER_TEMP/issue-events.json"
          echo "[]" > "$events"
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = labeled ] && [ "$LABEL" = allow-test-removal ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/events" > "$events"
          fi
          python3 -I .github/scripts/override_label.py \
            --event-name "$EVENT" --event-path "$GITHUB_EVENT_PATH" \
            --issue-events "$events" --head "$(git rev-parse HEAD)"

      - name: Compare tests with the base
        if: ${{ steps.base.outputs.ref != '' }}
        env:
          BASE: ${{ steps.base.outputs.ref }}
          APPROVED: ${{ steps.approval.outputs.allowed }}
          REASON: ${{ steps.approval.outputs.reason }}
        run: |
          if [ "$APPROVED" = true ]; then
            python3 -I .github/scripts/check_test_removal.py --base "$BASE" --approved "$REASON"
          else
            python3 -I .github/scripts/check_test_removal.py --base "$BASE"
          fi

  gate:
    name: gate
    if: ${{ always() }}
    needs: [static, tests, test-removal]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
