# Remove the allow-test-removal label when new commits arrive, so Onur's
# approval covers only the commits he saw. He adds the label again to approve
# the new head.
#
# This is housekeeping, not the safety check. The gate already ignores the
# label on every run except the one that adding the label starts, and pushes
# made with the built-in token start no workflow, so this job does not run
# for them. On pull requests from forks the token is read-only and the removal
# fails with a warning; the gate still ignores the label.

name: factory-label-reset

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  remove-approval-label:
    name: Remove allow-test-removal on new commits
    if: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-removal') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/allow-test-removal" > /dev/null \
            || echo "::warning::Could not remove the allow-test-removal label. The gate ignores it on new commits anyway."
