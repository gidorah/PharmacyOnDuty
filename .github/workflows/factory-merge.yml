# Factory tier A merge: plain code, no Claude (decision 9, sub-decision 5).
#
# The tier job starts it with `gh workflow run factory-merge.yml -f pr=<n>
# -f sha=<commit it checked>`. It merges only when, read again from GitHub:
# - the pull request is open, from this repository, and labeled `tier:A`
#   (and not stuck, blocked, in progress, or labeled B or C);
# - its head is the commit the tier job checked, both in the dispatch and in
#   the tier job's latest marker comment;
# - the gate's `gate` job is green on that commit;
# - the latest review since Onur's last restart has no blocking finding.
# It merges with a squash and passes the commit to GitHub, which refuses the
# merge if the head moved in between. Otherwise it comments why and labels
# the pull request `agent:blocked`.
#
# Tier B and C are never merged here: Onur presses Merge himself.

name: factory-merge

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: The commit the tier job checked
        required: true

permissions: {}

concurrency:
  group: factory-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge tier A
    if: github.actor == 'github-actions[bot]' || github.actor == 'gidorah'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .sandcastle

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the pipeline scripts
        working-directory: .sandcastle
        run: npm ci --ignore-scripts

      - name: Check and merge
        working-directory: .sandcastle
        run: node_modules/.bin/tsx steps/merge-job.ts --pr "$PR_NUMBER" --sha "$SHA"
