version: 2
updates:
  # Monitor Python dependencies managed by uv (pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    allow:
      - dependency-type: "all"
    versioning-strategy: "auto"

  # Keep the SHA-pinned actions in .github/workflows/ current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # The label pipeline's Sandcastle and Claude Code CLI pins (decision 11).
  # .sandcastle/ is tier C in factory/risk-map.yml, so these updates are too.
  - package-ecosystem: "npm"
    directory: "/.sandcastle"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
