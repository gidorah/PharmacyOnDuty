# Standing rules for PharmacyOnDuty: the only route to tier A.
#
# Onur writes and prunes these rules. The tier job reads only `rules` with
# `status: active`. Entries under `proposals` are candidates for Onur to
# accept, change or drop; nothing reads them.
#
# A pull request is tier A only when an active rule matches it and every
# other check of the tier rule allows it: no path in factory/risk-map.yml
# raises it (except where an area names the rule in
# `waived_by_standing_rule`), no reviewer finding in a high-risk category,
# CI is green, and the head commit is the one the tier job checked.

version: 1

rules:
  - id: dependabot-version-only
    status: active
    tier: A
    summary: >-
      Dependabot pull requests for the uv ecosystem that change only version
      numbers of existing dependencies, for patch updates.
    match:
      author: "dependabot[bot]"
      ecosystem: uv
      # Read from Dependabot's metadata (dependabot/fetch-metadata). In a
      # grouped pull request, every updated dependency must be a patch.
      update_types:
        - "version-update:semver-patch"
      # The pull request changes these files and no others.
      files_only:
        - pyproject.toml
        - uv.lock
      version_only: true
    # How the tier job decides `version_only`. If any of these fails, the
    # rule does not match and pyproject.toml and uv.lock make the change
    # tier C.
    version_only_check:
      pyproject.toml: >-
        Every changed line is a dependency line in [project].dependencies or
        [dependency-groups]. The removed and added lines name the same
        package, and only the version specifier differs. No line is added or
        removed outside those lists.
      uv.lock: >-
        No [[package]] entry is added or removed. Changed entries are only
        those of the updated dependencies, and inside them only the version,
        sdist and wheels fields change. The root package entry for
        pharmacyonduty changes only in the version specifiers of the updated
        dependencies.

proposals:
  - id: dependabot-minor-dev
    from: decision 3 (dependency bumps)
    summary: >-
      Extend dependabot-version-only to minor updates of development
      dependencies (the [dependency-groups] dev list: ruff, mypy, pytest and
      the type stubs). They don't run in production; CI covers them.
    open_question: >-
      The spring Codex automation also allowed minor updates of these
      packages. Should the rule follow it?

  - id: dependabot-exclusions
    from: the spring Codex automation (.codex/maintenance.md, removed in this pull request)
    summary: >-
      Never apply tier A to updates of these runtime packages, even patches:
      django, celery, django-celery-beat, django-celery-results, redis,
      django-redis, psycopg2-binary, sentry-sdk, requests, urllib3,
      gunicorn, whitenoise, django-tailwind, beautifulsoup4, python-dotenv.
    open_question: >-
      Patch releases of these packages are often security fixes. Excluding
      them keeps a person in the loop but slows those fixes down.

  - id: lint-fixes
    from: decision 3 (lint fixes)
    summary: >-
      Pull requests whose only change is the output of `ruff check --fix`
      and `ruff format`, with no hand edits, outside the risk map's paths.
    open_question: >-
      The tier job would need to rerun ruff on the base commit and compare
      the result with the pull request. Is that worth building before lint
      work actually shows up?

  - id: docs-only
    from: decision 3 (docs)
    summary: >-
      Pull requests that change only readme.md or other Markdown files
      outside the risk map's paths.
    open_question: >-
      CLAUDE.md and the AGENTS.md files are Markdown, but they instruct the
      agents. They should stay out of this rule, or move into the risk map.

  - id: small-refactors
    from: decision 3 (small refactors in code with strong tests)
    summary: >-
      Refactors that change no behaviour, in tier B paths with good test
      coverage, under a size limit.
    open_question: >-
      No deterministic step can tell that a change is behaviour-neutral, so
      the rule would rest on the agent's own claim. Leave this out until the
      pilot shows a check that can decide it.
